[project]
name = "shelfready-api"
version = "0.1.0"
description = "ShelfReady API, worker, and Strands agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.40",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.6",
  "pydantic==2.11.3",
  "pydantic-settings==2.8.1",
  "python-multipart==0.0.20",
  "strands-agents==1.54.0",
  "boto3==1.38.3",
  "Pillow==11.2.1",
  "python-slugify==8.0.4",
  "httpx==0.28.1",
  "orjson==3.10.16",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "pytest-cov==6.1.1",
  "ruff==0.11.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
